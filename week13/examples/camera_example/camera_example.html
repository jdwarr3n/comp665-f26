<!DOCTYPE html>
<!-- saved from url=(0073)http://learnwebgl.brown37.net/07_cameras/camera_lookat/camera_lookat.html -->
<html lang="en-US">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <!-- Tested with Plotly.js v1.58.4 -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="./js/controller.js"></script>

</head>

<body>

  <div>
    <div id="js-plotly-plot" style="display:inline-block;"></div>
    <div id="js-plotly-plot2" style="display:inline-block;"></div>
  </div>

  <div>
    <br/>
    <!-- Manipulate the function <strong>lookAt(M, eye_x, eye_y, eye_z,
      center_x, center_y, center_z, up_x, up_y, up_z)</strong><br> -->
    <br>
    <table>
      <tbody>
        <tr>
          <td style="text-align:center"><span id="eye_text"><strong>eye (0.0, 0.0, 5.0)</strong></span></td>
          <td style="text-align:center"><span id="center_text"><strong>center (0.0, 0.0, 0.0)</strong></span></td>
          <td style="text-align:center"><span id="up_text"><strong>up &lt;0.0, 1.0, 0.0&gt;</strong></span></td>
        </tr>
        <tr>
          <td>X: -5.0 <input type="range" id="W1_eyeX" min="-5.0" max="5.0" value="0.0" step="0.1" style="width:150px">
            +5.0</td>
          <td>X: -5.0 <input type="range" id="W1_cX" min="-5.0" max="5.0" value="0.0" step="0.1" style="width:150px">
            +5.0</td>
          <td>X: -1.0 <input type="range" id="W1_upX" min="-1.0" max="1.0" value="0.0" step="0.01" style="width:150px">
            +1.0</td>
        </tr>

        <tr>
          <td>Y: -5.0 <input type="range" id="W1_eyeY" min="-5.0" max="5.0" value="0.0" step="0.1" style="width:150px">
            +5.0</td>
          <td>Y: -5.0 <input type="range" id="W1_cY" min="-5.0" max="5.0" value="0.0" step="0.1" style="width:150px">
            +5.0</td>
          <td>Y: -1.0 <input type="range" id="W1_upY" min="-1.0" max="1.0" value="1.0" step="0.01" style="width:150px">
            +1.0</td>
        </tr>

        <tr>
          <td>Z: -5.0 <input type="range" id="W1_eyeZ" min="-5.0" max="5.0" value="5.0" step="0.1" style="width:150px">
            +5.0</td>
          <td>Z: -5.0 <input type="range" id="W1_cZ" min="-5.0" max="5.0" value="0.0" step="0.1" style="width:150px">
            +5.0</td>
          <td>Z: -1.0 <input type="range" id="W1_upZ" min="-1.0" max="1.0" value="0.0" step="0.01" style="width:150px">
            +1.0</td>
        </tr>

      </tbody>
    </table>

    <button id="W1_reset">Reset camera</button><br>
  </div>
</body>
<!--<script src="./js/view_1st_person_simple.js"></script>-->
<script src="./js/view_1st_person_blocks.js"></script>
<script src="./js/view_3rd_person.js"></script>
<script>
  bindEvents(plot_1st_person_div, plot_3rd_person_div);
</script>
</html>
